name: semantic semdup advisory

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      task_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bounded trace input
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-input"
          profile=tools/semantic_qa/profiles.json
          python3 tools/semantic_qa/trace_input.py             --base "${{ inputs.base_sha }}"             --head "${{ inputs.head_sha }}"             --output "$out"             --repository "${{ github.repository }}"             --task-id "${{ inputs.task_id }}"             --max-files "$(jq -r '.input_budget.max_files' "$profile")"             --max-total-bytes "$(jq -r '.input_budget.max_total_bytes' "$profile")"             --max-file-bytes "$(jq -r '.input_budget.max_file_bytes' "$profile")"

      - name: Run packaged advisory trace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out="$RUNNER_TEMP/semantic-semdup"
          input="$RUNNER_TEMP/semantic-input"
          mkdir -p "$out"
          python3 -m tools.semantic_qa.run_advisory             --tool semdup             --repo .             --base-sha "${{ inputs.base_sha }}"             --candidate-sha "${{ inputs.head_sha }}"             --repository "${{ github.repository }}"             --task-id "${{ inputs.task_id }}"             --profile tools/semantic_qa/profiles.json             --input-manifest "$input/input-manifest.json"             --input-root "$input"             --failure-classes docs/qa/failure-classes.md             --output-dir "$out"             --download-dir "$RUNNER_TEMP/semdup-package-download"             --runtime-dir "$RUNNER_TEMP/semdup-runtime"             --env-dir "$RUNNER_TEMP/semdup-env"
          rc=$?
          if [ "$rc" -ne 0 ] || [ ! -f "$out/receipt.json" ]; then
            python3 tools/semantic_qa/status_receipt.py               --output "$out/receipt.json"               --tool semdup               --status UNAVAILABLE               --repository "${{ github.repository }}"               --task-id "${{ inputs.task_id }}"               --base-sha "${{ inputs.base_sha }}"               --candidate-sha "${{ inputs.head_sha }}"               --profile tools/semantic_qa/profiles.json               --reason orchestration_failed
          fi

          status=$(jq -r '.status' "$out/receipt.json")
          freshness=$(jq -r '.toolchain.freshness.status // "UNKNOWN"' "$out/receipt.json")
          setup_ms=$(jq -r '.toolchain.setup_ms // 0' "$out/receipt.json")
          reasons=$(jq -c '.toolchain.freshness.reasons // []' "$out/receipt.json")
          if [ "$freshness" != "CURRENT" ] && [ "$freshness" != "UNKNOWN" ]; then
            echo "::warning title=semdup package freshness::$freshness $reasons"
          fi
          {
            echo "### semdup advisory"
            echo
            echo "- status: \`$status\`"
            echo "- package freshness: \`$freshness\`"
            echo "- package setup ms: \`$setup_ms\`"
            echo "- candidate: \`${{ inputs.head_sha }}\`"
            echo "- task: \`${{ inputs.task_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload advisory trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-semdup-${{ inputs.task_id }}-${{ inputs.head_sha }}
          path: |
            ${{ runner.temp }}/semantic-input
            ${{ runner.temp }}/semantic-semdup
          if-no-files-found: warn
          retention-days: 90
