name: semantic semdup advisory

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      task_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bounded trace input
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-input"
          profile=tools/semantic_qa/profiles.json
          python3 tools/semantic_qa/trace_input.py             --base "${{ inputs.base_sha }}"             --head "${{ inputs.head_sha }}"             --output "$out"             --repository "${{ github.repository }}"             --task-id "${{ inputs.task_id }}"             --max-files "$(jq -r '.input_budget.max_files' "$profile")"             --max-total-bytes "$(jq -r '.input_budget.max_total_bytes' "$profile")"             --max-file-bytes "$(jq -r '.input_budget.max_file_bytes' "$profile")"

      - name: Restore semdup Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/theseus-semdup-target
          key: semdup-cargo-v1-${{ runner.os }}-829f90ad94f453b73a24e46413202e9ece0b49e8

      - name: Restore semdup model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: ~/.cache/semdup
          key: semdup-model-v1-model-coderankembed-1-cpu-nbits-int4-asym

      - name: Run advisory trace
        shell: bash
        run: |
          set +e
          started=$(date +%s%3N)
          out="$RUNNER_TEMP/semantic-semdup"
          input="$RUNNER_TEMP/semantic-input"
          profile=tools/semantic_qa/profiles.json
          mkdir -p "$out"
          err="$out/setup-error.log"

          input_status=$(jq -r '.status' "$input/input-manifest.json")
          if [ "$input_status" = "READY" ]; then
            src="$RUNNER_TEMP/semdup-src"
            install="$RUNNER_TEMP/semdup-install"
            source_sha=$(jq -r '.semdup.source_sha' "$profile")
            git init "$src" >"$err" 2>&1
            git -C "$src" remote add origin https://github.com/niklebedenko/semdup.git >>"$err" 2>&1
            git -C "$src" fetch --depth=1 origin "$source_sha" >>"$err" 2>&1
            git -C "$src" checkout --detach FETCH_HEAD >>"$err" 2>&1
            test "$(git -C "$src" rev-parse HEAD)" = "$source_sha" >>"$err" 2>&1
            export CARGO_TARGET_DIR="$HOME/.cache/theseus-semdup-target"
            cargo install --path "$src" --locked --root "$install" >>"$err" 2>&1
            setup_rc=$?
            if [ "$setup_rc" -eq 0 ]; then
              export PATH="$install/bin:$PATH"
              export SEMDUP_CACHE="$HOME/.cache/semdup"
              python3 -m pip install --disable-pip-version-check --quiet "blake3==1.0.8" >>"$err" 2>&1
              setup_rc=$?
            fi
          else
            setup_rc=0
            export SEMDUP_CACHE="$HOME/.cache/semdup"
          fi

          if [ "$setup_rc" -eq 0 ]; then
            python3 tools/semantic_qa/semdup_trace.py               --repo .               --base-sha "${{ inputs.base_sha }}"               --candidate-sha "${{ inputs.head_sha }}"               --repository "${{ github.repository }}"               --task-id "${{ inputs.task_id }}"               --profile "$profile"               --input-manifest "$input/input-manifest.json"               --output-dir "$out" >>"$out/runner.log" 2>&1
            run_rc=$?
          else
            run_rc=$setup_rc
          fi

          if [ "$run_rc" -ne 0 ] || [ ! -f "$out/receipt.json" ]; then
            python3 tools/semantic_qa/status_receipt.py               --output "$out/receipt.json"               --tool semdup               --status UNAVAILABLE               --repository "${{ github.repository }}"               --task-id "${{ inputs.task_id }}"               --base-sha "${{ inputs.base_sha }}"               --candidate-sha "${{ inputs.head_sha }}"               --profile "$profile"               --error-file "$err"               --reason "setup_or_execution_failed"               --started-ms "$started"
          fi

          status=$(jq -r '.status' "$out/receipt.json")
          {
            echo "### semdup advisory"
            echo
            echo "- status: `$status`"
            echo "- candidate: `${{ inputs.head_sha }}`"
            echo "- task: `${{ inputs.task_id }}`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload advisory trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-semdup-${{ inputs.task_id }}-${{ inputs.head_sha }}
          path: |
            ${{ runner.temp }}/semantic-input
            ${{ runner.temp }}/semantic-semdup
          if-no-files-found: warn
          retention-days: 90
