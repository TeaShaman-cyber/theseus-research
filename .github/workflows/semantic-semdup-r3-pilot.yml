name: semantic semdup R3 pilot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semdup-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEMDUP_SOURCE_SHA: 829f90ad94f453b73a24e46413202e9ece0b49e8
      FIXTURE_ROOT: docs/qa/semantic-fixture-v1
    steps:
      - name: Checkout frozen fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen fixture
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  -\n' df3bf51cee0a7a57786b140979586ae28f4df7951fb2968e2a39eb1a1ed7048b > "$RUNNER_TEMP/expected.sha256"
          sha256sum "$FIXTURE_ROOT/fixture.sha256" > "$RUNNER_TEMP/observed.sha256"
          diff -u "$RUNNER_TEMP/expected.sha256" "$RUNNER_TEMP/observed.sha256"

      - name: Install exact semdup source
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/semdup-src"
          root="$RUNNER_TEMP/semdup-install"
          git init "$src"
          git -C "$src" remote add origin https://github.com/niklebedenko/semdup.git
          git -C "$src" fetch --depth=1 origin "$SEMDUP_SOURCE_SHA"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$SEMDUP_SOURCE_SHA"
          cargo --version
          rustc --version
          cargo install --path "$src" --locked --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/semdup" --version

      - name: Run frozen semdup fixture
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/semdup-install/bin:$PATH"
          out="$RUNNER_TEMP/semdup-r3-out"
          db="$RUNNER_TEMP/semdup-r3.sqlite"
          model_cache="$HOME/.cache/semdup"
          cases="$GITHUB_WORKSPACE/$FIXTURE_ROOT/cases"
          mkdir -p "$out"
          rm -rf "$model_cache"
          rm -f "$db" "$db-shm" "$db-wal"

          cargo --version > "$out/cargo-version.txt"
          rustc --version > "$out/rustc-version.txt"
          semdup --version > "$out/semdup-version.txt"

          cold_start=$(date +%s%3N)
          /usr/bin/time -v -o "$out/extract-cold.time" \
            semdup --db "$db" extract \
              --root "$cases" \
              --no-respect-gitignore \
              --granularity function
          /usr/bin/time -v -o "$out/embed-cold.time" \
            semdup --db "$db" embed --provider cpu
          /usr/bin/time -v -o "$out/scan-cold.time" \
            semdup --db "$db" scan \
              --no-refresh \
              --provider cpu \
              --threshold 0.0 \
              --index exact \
              --min-lines 1 \
              --unit-kind function \
              --json "$out/raw-cold.json" \
              --color never \
              --top 100
          cold_end=$(date +%s%3N)
          cold_wall_ms=$((cold_end-cold_start))

          cache_bytes_after_cold=$(du -sb "$model_cache" | awk '{print $1}')
          db_bytes_after_cold=$(du -b "$db" | awk '{print $1}')

          for threshold in 0.50 0.60 0.70 0.80 0.90 0.95; do
            label=${threshold/./}
            semdup --db "$db" scan \
              --no-refresh \
              --provider cpu \
              --threshold "$threshold" \
              --index exact \
              --min-lines 1 \
              --unit-kind function \
              --json "$out/threshold-$label.json" \
              --color never \
              --top 100 \
              > "$out/threshold-$label.txt"
          done

          warm_start=$(date +%s%3N)
          env \
            HTTP_PROXY=http://127.0.0.1:9 \
            HTTPS_PROXY=http://127.0.0.1:9 \
            ALL_PROXY=http://127.0.0.1:9 \
            /usr/bin/time -v -o "$out/embed-warm.time" \
            semdup --db "$db" embed --provider cpu
          env \
            HTTP_PROXY=http://127.0.0.1:9 \
            HTTPS_PROXY=http://127.0.0.1:9 \
            ALL_PROXY=http://127.0.0.1:9 \
            /usr/bin/time -v -o "$out/scan-warm.time" \
            semdup --db "$db" scan \
              --no-refresh \
              --provider cpu \
              --threshold 0.0 \
              --index exact \
              --min-lines 1 \
              --unit-kind function \
              --json "$out/raw-warm.json" \
              --color never \
              --top 100
          warm_end=$(date +%s%3N)
          warm_wall_ms=$((warm_end-warm_start))

          cache_bytes_after_warm=$(du -sb "$model_cache" | awk '{print $1}')
          db_bytes_after_warm=$(du -b "$db" | awk '{print $1}')

          semdup --db "$db" status > "$out/status.txt"
          sha256sum "$out/raw-cold.json" "$out/raw-warm.json" > "$out/repeat-sha256.txt"

          cold_peak=$(awk -F: '/Maximum resident set size/ {gsub(/^[ \t]+/, "", $2); print $2}' "$out/embed-cold.time")
          warm_peak=$(awk -F: '/Maximum resident set size/ {gsub(/^[ \t]+/, "", $2); print $2}' "$out/embed-warm.time")

          cat > "$out/runtime.json" <<JSON
          {
            "schema_version": 1,
            "fixture_digest": "df3bf51cee0a7a57786b140979586ae28f4df7951fb2968e2a39eb1a1ed7048b",
            "semdup_source_sha": "$SEMDUP_SOURCE_SHA",
            "provider": "cpu",
            "index": "exact",
            "min_lines": 1,
            "unit_kind": "function",
            "cold_wall_ms": $cold_wall_ms,
            "warm_wall_ms": $warm_wall_ms,
            "cold_embed_peak_rss_kb": ${cold_peak:-null},
            "warm_embed_peak_rss_kb": ${warm_peak:-null},
            "cache_bytes_after_cold": $cache_bytes_after_cold,
            "cache_bytes_after_warm": $cache_bytes_after_warm,
            "cache_bytes_delta_warm": $((cache_bytes_after_warm-cache_bytes_after_cold)),
            "db_bytes_after_cold": $db_bytes_after_cold,
            "db_bytes_after_warm": $db_bytes_after_warm,
            "warm_run_broken_proxy": true,
            "warm_run_succeeded": true,
            "network_attempted_warm": "UNKNOWN",
            "auth_or_secret_required_for_semdup": false
          }
          JSON

          python3 -m json.tool "$out/runtime.json" >/dev/null
          printf '%s\n' "--- runtime ---"
          cat "$out/runtime.json"
          printf '%s\n' "--- repeat hashes ---"
          cat "$out/repeat-sha256.txt"
          printf '%s\n' "--- status ---"
          cat "$out/status.txt"

      - name: Upload raw R3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semdup-r3-${{ github.sha }}
          path: ${{ runner.temp }}/semdup-r3-out
          if-no-files-found: error
          retention-days: 14
